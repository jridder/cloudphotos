[package]
name = "cloudphotos"
description = "Browse your iCloud Photos library on GNOME"
version = "0.1.2"
edition = "2024"
license = "MIT"

[[bin]]
name = "cloudphotos"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
async-channel = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "rayon"] }
rayon = "1"
kamadak-exif = "0.6"
rusqlite = { version = "0.37", features = ["bundled", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

# Decoding originals: glycin's sandboxed loaders on Linux; on Windows (no
# glycin) libheif for HEIC and the image crate for the rest.
[target.'cfg(not(windows))'.dependencies]
glycin = { version = "4", features = ["gdk4"] }

[target.'cfg(windows)'.dependencies]
libheif-rs = "2"
# Video: GTK's own GStreamer sink hands over D3D12 textures that come out
# blank, so playback goes through playbin and gtk4paintablesink instead.
gst = { package = "gstreamer", version = "0.25" }

[build-dependencies]
# The Windows executable's icon and version details (build.rs).
embed-resource = "3"

[profile.release]
lto = "thin"

# Image work is unusably slow unoptimized; build these optimized even in dev.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.jpeg-encoder]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.tiff]
opt-level = 3
