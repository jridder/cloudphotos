[package]
name = "cloudphotos"
description = "Browse your iCloud Photos library on GNOME"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "cloudphotos"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
async-channel = "2"
kamadak-exif = "0.6"
rusqlite = { version = "0.37", features = ["bundled", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[profile.release]
lto = "thin"
